<div style="height: 765px; width: 100%" id="myGrid">

  <ag-grid-angular
    [rowData]="rowData | async"
    [gridOptions]="gridOptions"
    [columnDefs]="colDefs()"
    [defaultColDef]="defaultColDef"
    [theme]="myTheme"
    style="height: 100%; width: 100%"
    (gridReady)="onGridReady($event)"
  />
</div>
